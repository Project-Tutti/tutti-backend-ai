# ═══════════════════════════════════════════════════════════
# Tutti AI Server — On-Premise Docker Compose
# ═══════════════════════════════════════════════════════════
# 실행: docker compose up -d --scale ai-server=2
# ═══════════════════════════════════════════════════════════

services:
  # ── Cloudflare Tunnel: 외부 접근 (AI_SERVER_HOST → nginx) ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started

  # ── Nginx: 로드밸런서 (라운드로빈) ──
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ai-server:
        condition: service_healthy
    restart: unless-stopped

  # ── AI Server: 추론 워커 (--scale로 복제) ──
  ai-server:
    image: us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/tutti/ai-server:latest
    environment:
      - MODEL_DIR=/models
      - RESULTS_DIR=/tmp/results
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GPU_ID=0
      - AI_SERVER_API_KEY=${AI_SERVER_API_KEY}
    volumes:
      - ./models:/models:ro
      - ai-results:/tmp/results
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

volumes:
  ai-results:
