apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: tutti
spec:
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      serviceAccountName: ai-server-sa # GCS 접근 Workload Identity
      initContainers:
        - name: model-downloader
          image: google/cloud-sdk:slim
          command:
            - sh
            - -c
            - |
              echo "Downloading models from GCS..."
              gsutil -m cp -r gs://${GCS_MODEL_BUCKET}/${MODEL_VERSION}/* /models/
              echo "Download complete. Files:"
              ls -la /models/
              echo "Registry:"
              cat /models/registry.json
          env:
            - name: GCS_MODEL_BUCKET
              value: "tutti-ai-models"
            - name: MODEL_VERSION
              value: "v1"
          volumeMounts:
            - name: model-volume
              mountPath: /models
      containers:
        - name: ai-server
          image: REGION-docker.pkg.dev/PROJECT_ID/tutti/ai-server:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models"
            - name: RESULTS_DIR
              value: "/tmp/results"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: model-volume
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              nvidia.com/gpu: 1 # GKE Autopilot/Standard 공통: 1개의 물리 GPU 할당 요청
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60 # 모델 로딩 시간 고려
            periodSeconds: 10
            failureThreshold: 18 # 최대 3분 대기
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4 # T4 노드 찾아가기
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule" # 우리가 만든 GPU Taint 결계를 뚫고 들어갈 수 있는 유일한 통행증
      volumes:
        - name: model-volume
          emptyDir:
            sizeLimit: 10Gi
