# ═══════════════════════════════════════════════════════════
# Nginx — AI Server 로드밸런서
# ═══════════════════════════════════════════════════════════
# Docker Compose의 내부 DNS가 ai-server를 라운드로빈으로 해석
# --scale ai-server=N 으로 워커 수를 조절하면 자동 분산
# ═══════════════════════════════════════════════════════════

events {
    worker_connections 64;
}

http {
    server {
        listen 80;
        server_name _;

        # Docker 내부 DNS 활용 (무중단 배포 시 새 컨테이너 IP 실시간 감지)
        resolver 127.0.0.11 valid=5s;
        set $ai_backend "http://ai-server:8000";

        # MIDI 파일 업로드 허용 크기
        client_max_body_size 50M;

        location / {
            proxy_pass $ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # AI 추론은 시간이 걸리므로 타임아웃 넉넉하게
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check 엔드포인트 (Cloudflare 모니터링용)
        location /health {
            proxy_pass $ai_backend;
            proxy_read_timeout 10s;
        }
    }
}
