# ═══════════════════════════════════════════════════════════
# Nginx — AI Server 로드밸런서
# ═══════════════════════════════════════════════════════════
# Docker Compose의 내부 DNS가 ai-server를 라운드로빈으로 해석
# --scale ai-server=N 으로 워커 수를 조절하면 자동 분산
# ═══════════════════════════════════════════════════════════

events {
    worker_connections 64;
}

http {
    upstream ai_backend {
        server ai-server:8000;
    }

    server {
        listen 80;
        server_name _;

        # MIDI 파일 업로드 허용 크기
        client_max_body_size 50M;

        location / {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # AI 추론은 시간이 걸리므로 타임아웃 넉넉하게
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check 엔드포인트 (Cloudflare 모니터링용)
        location /health {
            proxy_pass http://ai_backend/health;
            proxy_read_timeout 10s;
        }
    }
}
