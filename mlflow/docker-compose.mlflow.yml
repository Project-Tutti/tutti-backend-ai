# ═══════════════════════════════════════════════════════════
# Tutti MLflow + Optuna Dashboard Server
# ═══════════════════════════════════════════════════════════
# 실행: docker compose -f mlflow/docker-compose.mlflow.yml up -d
# MLflow:  Cloudflare Tunnel → mlflow.tutti.asia
# Optuna:  Cloudflare Tunnel → optuna.tutti.asia
# ═══════════════════════════════════════════════════════════

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "127.0.0.1:5000:5000"   # 로컬만 바인딩 (Cloudflare Tunnel이 외부 노출)
    restart: unless-stopped

  optuna-dashboard:
    image: python:3.12-slim
    command: >
      sh -c "pip install -q optuna-dashboard &&
             optuna-dashboard sqlite:////data/optuna_studies.db
             --host 0.0.0.0 --port 8080"
    volumes:
      # GPU 서버의 tutti-backend-ai 디렉토리 → 컨테이너 /data
      # optuna_studies.db 파일이 여기에 생성됨
      - /root/tutti-backend-ai:/data:ro
    ports:
      - "127.0.0.1:8080:8080"   # 로컬만 바인딩 (Cloudflare Tunnel이 외부 노출)
    restart: unless-stopped

volumes:
  mlflow-data:

