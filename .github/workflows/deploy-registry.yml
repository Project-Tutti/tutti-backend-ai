name: Deploy Model Registry

on:
  push:
    branches: [main]
    paths:
      - "registry.json"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

jobs:
  deploy-registry:
    name: 📤 Deploy registry.json
    runs-on: ubuntu-latest
    steps:
      # ── SSH로 학교 서버의 registry.json 업데이트 ──
      - uses: actions/checkout@v4

      - name: Deploy registry via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          password: ${{ secrets.ONPREM_PASSWORD }}
          script: |
            cd ~/tutti-backend-ai

            echo "📥 Pulling latest registry.json from git..."
            git pull origin main

            echo "📋 Updated registry.json:"
            cat models/registry.json 2>/dev/null || cat registry.json

            echo ""
            echo "🔄 Restarting AI servers to reload model registry..."
            docker compose restart ai-server

            echo "⏳ Waiting for health checks..."
            sleep 30

            echo "📋 Service status:"
            docker compose ps

            echo ""
            echo "🏥 Health check:"
            curl -sf http://localhost:8080/health && echo " ✅ OK" || echo " ❌ FAIL"
