name: AI Server CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/ci-ai.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"

  # 수동 배포 지원
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: ${{ secrets.GCP_PROJECT_ID }}/tutti/ai-server

jobs:
  # ================================================================
  # Job 1: Build & Push — Docker 이미지 빌드 후 Artifact Registry 푸시
  # ================================================================
  build-and-push:
    name: 🐳 Build & Push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation에 필요
    outputs:
      image-tag: ${{ steps.meta.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v4

      # ── GCP 인증 (Workload Identity Federation) ──
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # ── 이미지 태그 생성 ──
      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 Image tag: ${SHORT_SHA}"

      # ── Docker 빌드 & 푸시 (BuildKit + GHA 캐싱) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short-sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # Job 2: Deploy — SSH로 온프레미스 서버에 배포
  # ================================================================
  deploy-onprem:
    name: 🚀 Deploy to On-Premise
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # ── SSH로 학교 서버에 접속하여 배포 ──
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ONPREM_HOST }}
          username: ${{ secrets.ONPREM_USER }}
          password: ${{ secrets.ONPREM_PASSWORD }}
          script: |
            cd ~/tutti-backend-ai

            echo "📦 Pulling latest image..."
            docker compose pull ai-server

            echo "🔄 Restarting services..."
            docker compose up -d --scale ai-server=2

            echo "⏳ Waiting for health checks..."
            sleep 30

            echo "📋 Service status:"
            docker compose ps

            echo ""
            echo "🏥 Health check:"
            curl -sf http://localhost:8080/health && echo " ✅ OK" || echo " ❌ FAIL"
