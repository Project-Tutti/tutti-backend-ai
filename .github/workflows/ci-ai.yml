name: AI Server CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  # PR 이벤트 (빌드만 검증)
  pull_request:
    branches: [main]
    paths:
      - "ai_core/**"
      - "contracts/**"
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
  # 수동 배포 지원
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: ${{ secrets.GCP_PROJECT_ID }}/tutti/ai-server

jobs:
  # ================================================================
  # Job 1: Test — AI Core 단위 테스트 게이트
  # ================================================================
  test-ai-core:
    name: 🧪 Test AI Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group test --no-install-project

      - name: Run AI Core tests
        run: uv run pytest tests/test_ai_core.py tests/test_contracts.py -v --tb=short

      - name: Verify contracts
        run: |
          uv run python -c "
          from contracts.interfaces import ArrangementEngine
          from ai_core.arrangement import run_arrangement, resolve_target
          print('✅ Contract verification passed')
          "

  # ================================================================
  # Job 2: Build & Push — Docker 이미지 빌드 후 Artifact Registry 푸시
  # ================================================================
  build-and-push:
    name: 🐳 Build & Push
    needs: test-ai-core
    # PR을 포함하여 실행하되, PR 환경에서는 이미지를 push하지 않고 빌드 검증만 수행
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation에 필요
    outputs:
      image-tag: ${{ steps.meta.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v4

      # ── GCP 인증 (Workload Identity Federation) ──
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # ── 이미지 태그 생성 ──
      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 Image tag: ${SHORT_SHA}"

      # ── Docker 빌드 & 푸시 (BuildKit + GHA 캐싱) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short-sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # Job 3: Deploy — 온프레미스 서버 배포 및 환경 변수 동기화
  # ================================================================
  deploy-onprem:
    name: 🚀 Deploy to On-Premise
    needs: build-and-push
    # 빌드가 성공적이거나 skip되었을 때 항상 배포 진행 (registry.json 등 Docker 이미지가 필요없는 변경사항도 적용하기 위함)
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    environment: production
    steps:
      - name: Execute local deployment script
        env:
          TUNNEL_TOKEN: ${{ secrets.AI_SERVER_CF_TUNNEL_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          AI_SERVER_API_KEY: ${{ secrets.AI_SERVER_API_KEY }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_TLS: ${{ secrets.REDIS_TLS }}
        run: |
          cd ~/tutti-backend-ai

          echo "📥 1. Syncing latest code (Force clean)..."
          git fetch origin main
          git reset --hard origin/main

          echo "📂 1.5. Syncing registry.json to models/ directory..."
          cp -f registry.json models/registry.json

          echo "🔐 2. Updating .env from GitHub Secrets..."
          echo "TUNNEL_TOKEN=${TUNNEL_TOKEN}" > .env
          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}" >> .env
          echo "AI_SERVER_API_KEY=${AI_SERVER_API_KEY}" >> .env
          echo "LOG_LEVEL=${LOG_LEVEL:-info}" >> .env
          echo "REDIS_HOST=${REDIS_HOST}" >> .env
          echo "REDIS_PORT=${REDIS_PORT:-6379}" >> .env
          echo "REDIS_PASSWORD=${REDIS_PASSWORD}" >> .env
          echo "REDIS_TLS=${REDIS_TLS:-false}" >> .env

          echo "📦 3. Pulling latest artifacts..."
          docker compose pull

          echo "🔄 4. Rolling update with Zero-Downtime config..."
          docker compose up -d --remove-orphans
          
          echo "🧹 5. Cleaning up old unused Docker images..."
          docker image prune -f

          echo "📋 Service status:"
          docker compose ps

          echo ""
          echo "🏥 Health check (Worker):"
          echo "  ⏳ 모델 로딩에 최대 3분 소요됩니다."
          echo "  즉시 확인: docker compose exec ai-worker curl -sf http://localhost:8000/health"
          docker compose ps ai-worker --format '{{.Health}}' | grep -qi healthy \
            && echo "  ✅ Worker Ready" \
            || echo "  ⏳ Worker starting — 모델 로딩 중 (docker compose logs -f ai-worker 로 확인)"
